<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geomini:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="sidebar-dashboard-name">
          <img
            src="assets/view-dashboard.svg"
            alt="Dashboard logo"
            class="sidebar-icon"
          />
          <span class="sidebar-name">Dashboard</span>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-btn">
            <img
              src="assets/home-account.svg"
              alt="Home logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Home</span>
          </div>

          <div class="sidebar-btn">
            <img
              src="assets/account.svg"
              alt="Profile logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Profile</span>
          </div>

          <div class="sidebar-btn">
            <img
              src="assets/message.svg"
              alt="Message logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Messages</span>
          </div>
          <div class="sidebar-btn">
            <img
              src="assets/history.svg"
              alt="history logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">History</span>
          </div>

          <div class="sidebar-btn">
            <img
              src="assets/book-open-blank-variant-outline.svg"
              alt="Tasks logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Tasks</span>
          </div>

          <div class="sidebar-btn">
            <img
              src="assets/account-group.svg"
              alt="Communities logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Communities</span>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-btn">
            <img
              src="assets/cog.svg"
              alt="Settings logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Settings</span>
          </div>
          <div class="sidebar-btn">
            <img
              src="assets/chat-question.svg"
              alt="Support logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Support</span>
          </div>
          <div class="sidebar-btn">
            <img
              src="assets/seatbelt.svg"
              alt="Privacy logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Privacy</span>
          </div>
        </div>
      </div>

      <div class="header">
        <div class="search-bar">
          <img
            src="/assets/magnify.svg"
            alt="Search icon"
            class="header-icon"
          />
          <input type="text" name="search-input" class="search-input" />
        </div>

        <div class="profile-bar">
          <img
            src="assets/bell-ring.svg"
            alt="notification icon"
            class="header-icon"
          />
          <img
            src="assets/cheetah.jpg"
            alt="cheetah profile picture"
            class="profile-picture-top"
          />
          <span>John Cena</span>
        </div>

        <div class="main-profile-bar">
          <img
            src="assets/cheetah.jpg"
            alt="cheetah profile picture"
            class="profile-picture-main"
          />
          <h6>Hi there,</h6>
          <span>John Cena (@John)</span>
        </div>

        <div class="new-upload-share">
          <button class="header-post-btn">New</button>
          <button class="header-post-btn">Upload</button>
          <button class="header-post-btn">Share</button>
        </div>
      </div>

      <div class="main-content">
        <div class="projects-section">
          <span>Your Projects</span>

          <div class="project-card">
            <div class="project-card-words">
              <span>Super Cool Project</span>
              <p>Test paragraph.</p>
            </div>
            <div class="symbols">
              <img
                src="assets/star-remove-outline.svg"
                alt="star icon"
                class="card-icon"
              />
            </div>
            <div class="symbols">
              <img
                src="assets/eye-plus-outline.svg"
                alt="eye icon"
                class="card-icon"
              />
            </div>

            <div class="symbols">
              <img
                src="assets/align-vertical-distribute.svg"
                alt="lines icon"
                class="card-icon"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
