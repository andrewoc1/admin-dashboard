<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geomini:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="sidebar-dashboard-name">
          <img
            src="assets/view-dashboard.svg"
            alt="Dashboard logo"
            class="sidebar-icon"
          />
          <span class="sidebar-name">Dashboard</span>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-btn">
            <img
              src="assets/home-account.svg"
              alt="Home logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Home</span>
          </div>

          <div class="sidebar-btn">
            <img
              src="assets/account.svg"
              alt="Profile logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Profile</span>
          </div>

          <div class="sidebar-btn">
            <img
              src="assets/message.svg"
              alt="Message logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Messages</span>
          </div>
          <div class="sidebar-btn">
            <img
              src="assets/history.svg"
              alt="history logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">History</span>
          </div>

          <div class="sidebar-btn">
            <img
              src="assets/book-open-blank-variant-outline.svg"
              alt="Tasks logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Tasks</span>
          </div>

          <div class="sidebar-btn">
            <img
              src="assets/account-group.svg"
              alt="Communities logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Communities</span>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-btn">
            <img
              src="assets/cog.svg"
              alt="Settings logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Settings</span>
          </div>
          <div class="sidebar-btn">
            <img
              src="assets/chat-question.svg"
              alt="Support logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Support</span>
          </div>
          <div class="sidebar-btn">
            <img
              src="assets/seatbelt.svg"
              alt="Privacy logo"
              class="sidebar-icon"
            />
            <span class="sidebar-name">Privacy</span>
          </div>
        </div>
      </div>

      <div class="header">
        <div class="search-bar"></div>

        <div class="profile-bar"></div>

        <div class="main-profile-bar"></div>

        <div class="new-upload-share"></div>
      </div>

      <div class="main-content"></div>
    </div>
  </body>
</html>
